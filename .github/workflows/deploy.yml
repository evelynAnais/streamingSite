name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create config file with secrets
        run: |
          cat > config.js << 'EOF'
          // This file is generated by GitHub Actions - do not edit manually
          window.GAME_PICKER_CONFIG = {
            STEAM_API_KEY: '${{ secrets.STEAM_API_KEY }}',
            STEAM_IDS: [
              '${{ secrets.STEAM_ID_1 }}',
              '${{ secrets.STEAM_ID_2 }}', 
              '${{ secrets.STEAM_ID_3 }}',
              '${{ secrets.STEAM_ID_4 }}'
            ],
            PLAYER_NAMES: {
              '${{ secrets.STEAM_ID_1 }}': '${{ secrets.PLAYER_NAME_1 }}',
              '${{ secrets.STEAM_ID_2 }}': '${{ secrets.PLAYER_NAME_2 }}',
              '${{ secrets.STEAM_ID_3 }}': '${{ secrets.PLAYER_NAME_3 }}',
              '${{ secrets.STEAM_ID_4 }}': '${{ secrets.PLAYER_NAME_4 }}'
            },
            ACCESS_PASSWORD: '${{ secrets.GAME_PICKER_PASSWORD }}'
          };
          EOF
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4